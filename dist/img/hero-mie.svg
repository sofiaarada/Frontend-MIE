    <line x1="310" y1="796" x2="310" y2="816"/>
    <line x1="1290" y1="796" x2="1290" y2="816"/>
  </g>
  <text x="800" y="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="3" fill="#64748B">BLOQUE PRINCIPAL · 3 NIVELES</text>

  <!-- Ala izquierda -->
  <g>
    <rect x="298" y="414" width="244" height="20" rx="6" fill="#1B3568"/>
    <rect x="310" y="430" width="220" height="350" fill="#101F41" stroke="#24509B" stroke-opacity="0.55"/>
    <g>
      <rect x="336" y="478" width="44" height="52" rx="4" fill="url(#vidrio)"/>
      <rect x="398" y="478" width="44" height="52" rx="4" fill="#274B8F"/>
      <rect x="460" y="478" width="44" height="52" rx="4" fill="url(#vidrio)"/>
      <rect x="336" y="566" width="44" height="52" rx="4" fill="#274B8F"/>
      <rect x="398" y="566" width="44" height="52" rx="4" fill="url(#vidrio)"/>
      <rect x="460" y="566" width="44" height="52" rx="4" fill="#274B8F"/>
    </g>
    <rect x="398" y="680" width="44" height="100" rx="4" fill="#0E1D3D" stroke="#60A5FA" stroke-opacity="0.5"/>
  </g>

  <!-- Ala derecha -->
