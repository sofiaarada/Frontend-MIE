    <rect x="762" y="634" width="76" height="146" rx="4" fill="#0E1D3D" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="800" y1="634" x2="800" y2="780" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="746" y="780" width="108" height="10" rx="3" fill="#16305F"/>
    <rect x="730" y="790" width="140" height="10" rx="3" fill="#122649"/>

