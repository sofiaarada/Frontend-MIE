    <text x="258" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700" fill="#F1F5F9">74%</text>
    <text x="258" y="326" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94A3B8">Objetivo ciclo: 85%</text>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
      <circle cx="132" cy="366" r="5" fill="#22C55E"/>
      <text x="144" y="371" fill="#CBD5E1">Bueno 61%</text>
      <circle cx="252" cy="366" r="5" fill="#F59E0B"/>
      <text x="264" y="371" fill="#CBD5E1">Regular 28%</text>
      <circle cx="376" cy="366" r="5" fill="#EF4444"/>
      <text x="352" y="392" fill="#CBD5E1">Crítico 11%</text>
    </g>
  </g>

  <!-- Panel órdenes de trabajo -->
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.4s" fill="freeze"/>
    <rect x="1180" y="150" width="340" height="252" rx="16" fill="url(#panelBg)" stroke="#3B82F6" stroke-opacity="0.25"/>
    <text x="1208" y="188" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="3" fill="#93C5FD">ÓRDENES DE TRABAJO</text>
    <g>
      <rect x="1222" y="308" width="26" height="54" rx="5" fill="#2563EB"/>
      <rect x="1272" y="284" width="26" height="78" rx="5" fill="#3B82F6"/>
      <rect x="1322" y="298" width="26" height="64" rx="5" fill="#2563EB"/>
      <rect x="1372" y="266" width="26" height="96" rx="5" fill="#3B82F6"/>
      <rect x="1422" y="290" width="26" height="72" rx="5" fill="#2563EB"/>
      <rect x="1472" y="252" width="26" height="110" rx="5" fill="#22C55E"/>
    </g>
    <line x1="1208" y1="362" x2="1492" y2="362" stroke="#334155" stroke-width="1.5"/>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
      <text x="1235" y="382">E</text>
      <text x="1285" y="382">F</text>
      <text x="1335" y="382">M</text>
      <text x="1385" y="382">A</text>
      <text x="1435" y="382">M</text>
      <text x="1485" y="382">J</text>
    </g>
  </g>

  <!-- Leyenda inferior -->
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.55s" fill="freeze"/>
    <rect x="560" y="836" width="480" height="52" rx="12" fill="#0C1730" fill-opacity="0.85" stroke="#3B82F6" stroke-opacity="0.2"/>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#CBD5E1">
      <circle cx="596" cy="862" r="6" fill="#22C55E"/>
      <text x="612" y="868">Bueno</text>
      <circle cx="700" cy="862" r="6" fill="#F59E0B"/>
      <text x="716" y="868">Regular</text>
      <circle cx="820" cy="862" r="6" fill="#EF4444"/>
      <text x="836" y="868">Crítico</text>
      <circle cx="928" cy="862" r="6" fill="#3B82F6"/>
      <text x="944" y="868">En revisión</text>
