    <polyline points="627,589 520,589 470,640"/>
  </g>
  <g>
    <rect x="1058" y="304" width="216" height="46" rx="10" fill="#0C1730" fill-opacity="0.92" stroke="#22C55E" stroke-opacity="0.5"/>
