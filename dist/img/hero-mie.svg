    <circle cx="800" cy="312" r="30" fill="#0F2145" stroke="#60A5FA" stroke-opacity="0.7" stroke-width="3"/>
    <line x1="800" y1="312" x2="800" y2="292" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="800" y1="312" x2="814" y2="318" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>

