<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Campus educativo monitoreado digitalmente">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1226"/>
      <stop offset="0.55" stop-color="#0C1834"/>
      <stop offset="1" stop-color="#0E1D42"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bpChica" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="bpGrande" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#3B82F6" stroke-opacity="0.10"/>
    </pattern>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E6CC0"/>
      <stop offset="1" stop-color="#24447F"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1730" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0A1226" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="1000" fill="url(#cielo)"/>
  <rect width="1600" height="1000" fill="url(#bpChica)"/>
  <rect width="1600" height="1000" fill="url(#bpGrande)"/>
  <ellipse cx="800" cy="520" rx="620" ry="400" fill="url(#halo)"/>

  <!-- Partículas -->
  <g fill="#60A5FA">
    <circle cx="220" cy="120" r="2.5" opacity="0.5"/>
    <circle cx="480" cy="70" r="2" opacity="0.35"/>
    <circle cx="760" cy="120" r="2.5" opacity="0.4"/>
    <circle cx="1120" cy="80" r="2" opacity="0.45"/>
    <circle cx="1380" cy="140" r="2.5" opacity="0.35"/>
    <circle cx="1520" cy="90" r="2" opacity="0.4"/>
    <circle cx="90" cy="330" r="2" opacity="0.3"/>
    <circle cx="1510" cy="420" r="2" opacity="0.3"/>
  </g>

  <!-- Brújula -->
  <g transform="translate(140,96)" opacity="0.85">
    <circle r="30" fill="none" stroke="#3B82F6" stroke-opacity="0.4"/>
    <circle r="3" fill="#60A5FA"/>
    <path d="M0,-22 L7,4 L0,-1 L-7,4 Z" fill="#60A5FA"/>
    <text y="-38" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#93C5FD" font-weight="600">N</text>
  </g>

  <!-- Suelo -->
  <line x1="120" y1="780" x2="1480" y2="780" stroke="#1E3A8A" stroke-width="2.5"/>
