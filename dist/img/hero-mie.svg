    <rect x="1058" y="414" width="244" height="20" rx="6" fill="#1B3568"/>
    <rect x="1070" y="430" width="220" height="350" fill="#101F41" stroke="#24509B" stroke-opacity="0.55"/>
    <g>
      <rect x="1096" y="478" width="44" height="52" rx="4" fill="url(#vidrio)"/>
      <rect x="1158" y="478" width="44" height="52" rx="4" fill="url(#vidrio)"/>
      <rect x="1220" y="478" width="44" height="52" rx="4" fill="#274B8F"/>
      <rect x="1096" y="566" width="44" height="52" rx="4" fill="#274B8F"/>
      <rect x="1158" y="566" width="44" height="52" rx="4" fill="url(#vidrio)"/>
      <rect x="1220" y="566" width="44" height="52" rx="4" fill="url(#vidrio)"/>
    </g>
    <rect x="1158" y="680" width="44" height="100" rx="4" fill="#0E1D3D" stroke="#60A5FA" stroke-opacity="0.5"/>
  </g>

  <!-- Bloque central -->
  <g>
    <rect x="545" y="228" width="510" height="26" rx="6" fill="#1B3568"/>
    <rect x="560" y="250" width="480" height="530" fill="#14264E" stroke="#2C5AAE" stroke-opacity="0.6"/>

