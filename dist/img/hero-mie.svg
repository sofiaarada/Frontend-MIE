    <g>
      <rect x="604" y="380" width="46" height="58" rx="4" fill="url(#vidrio)"/>
      <rect x="672" y="380" width="46" height="58" rx="4" fill="#274B8F"/>
      <rect x="740" y="380" width="46" height="58" rx="4" fill="#274B8F"/>
      <rect x="828" y="380" width="46" height="58" rx="4" fill="url(#vidrio)"/>
      <rect x="896" y="380" width="46" height="58" rx="4" fill="url(#vidrio)"/>
      <rect x="964" y="380" width="46" height="58" rx="4" fill="#274B8F"/>
