      <rect x="672" y="560" width="46" height="58" rx="4" fill="#274B8F"/>
      <rect x="740" y="560" width="46" height="58" rx="4" fill="url(#vidrio)"/>
      <rect x="828" y="560" width="46" height="58" rx="4" fill="#274B8F"/>
