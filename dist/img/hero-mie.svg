    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
    <rect x="1236" y="60" width="284" height="46" rx="23" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.4"/>
    <circle cx="1264" cy="83" r="6" fill="#22C55E">
