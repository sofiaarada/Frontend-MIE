    <text x="1098" y="333" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#BBF7D0">Aula 101 · Bueno</text>
  </g>
  <g>
    <rect x="252" y="618" width="216" height="46" rx="10" fill="#0C1730" fill-opacity="0.92" stroke="#EF4444" stroke-opacity="0.5"/>
