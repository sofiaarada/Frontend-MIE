  </g>

  <!-- Panel índice de estado -->
  <g>
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.25s" fill="freeze"/>
    <rect x="88" y="168" width="340" height="232" rx="16" fill="url(#panelBg)" stroke="#3B82F6" stroke-opacity="0.25"/>
    <text x="116" y="206" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="3" fill="#93C5FD">ÍNDICE DE ESTADO</text>
    <path d="M 194 306 A 64 64 0 0 1 322 306" fill="none" stroke="#1E3A8A" stroke-width="14" stroke-linecap="round"/>
    <path d="M 194 306 A 64 64 0 0 1 322 306" fill="none" stroke="#22C55E" stroke-width="14" stroke-linecap="round" stroke-dasharray="149 999">
      <animate attributeName="stroke-dasharray" values="0 999;149 999" dur="1.4s" begin="0.5s" fill="freeze"/>
