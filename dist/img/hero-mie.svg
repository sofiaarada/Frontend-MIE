      <rect x="672" y="470" width="46" height="58" rx="4" fill="url(#vidrio)"/>
      <rect x="740" y="470" width="46" height="58" rx="4" fill="#274B8F"/>
      <rect x="828" y="470" width="46" height="58" rx="4" fill="url(#vidrio)"/>
      <rect x="896" y="470" width="46" height="58" rx="4" fill="#F59E0B" opacity="0.9"/>
