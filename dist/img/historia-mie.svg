<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="Inspector revisando un espacio con el sistema MIE en una tablet">
  <defs>
    <linearGradient id="cieloV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <pattern id="bpSuave" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2563EB" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Ambiente -->
  <rect width="1200" height="1200" fill="#F6F8FC"/>
  <rect width="1200" height="1200" fill="url(#bpSuave)"/>
  <rect y="820" width="1200" height="380" fill="#E4E9F2"/>
  <line x1="0" y1="820" x2="1200" y2="820" stroke="#C9D3E4" stroke-width="4"/>
  <g stroke="#D8DFEC" stroke-width="2">
    <line x1="0" y1="910" x2="1200" y2="910"/>
    <line x1="0" y1="1010" x2="1200" y2="1010"/>
    <line x1="0" y1="1120" x2="1200" y2="1120"/>
  </g>

  <!-- Luz de ventana -->
  <polygon points="150,530 400,530 560,830 40,830" fill="#BFDBFE" opacity="0.28"/>

  <!-- Ventana -->
  <g>
    <rect x="110" y="150" width="300" height="380" rx="10" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="7"/>
    <rect x="132" y="172" width="256" height="336" rx="4" fill="url(#cieloV)"/>
    <ellipse cx="210" cy="260" rx="52" ry="20" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="320" cy="330" rx="44" ry="16" fill="#FFFFFF" opacity="0.75"/>
    <line x1="260" y1="172" x2="260" y2="508" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="132" y1="340" x2="388" y2="340" stroke="#FFFFFF" stroke-width="8"/>
  </g>

  <!-- Reloj de pared -->
  <g transform="translate(700,110)">
    <circle r="28" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="5"/>
    <line y2="-16" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x2="11" y2="5" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pizarrón -->
  <g>
    <rect x="500" y="220" width="290" height="190" rx="10" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="6"/>
    <polyline points="532,360 584,320 636,342 690,296 748,308" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="532" y1="386" x2="700" y2="386" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="532" y1="270" x2="640" y2="270" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>
    <line x1="662" y1="270" x2="712" y2="270" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <rect x="600" y="414" width="90" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <!-- Puerta con cartel -->
  <g>
    <rect x="905" y="300" width="185" height="520" rx="8" fill="#FFFFFF" stroke="#C9D4E6" stroke-width="6"/>
    <rect x="935" y="340" width="125" height="80" rx="6" fill="#BFDBFE"/>
    <rect x="935" y="450" width="125" height="150" rx="6" fill="none" stroke="#DDE5F0" stroke-width="5"/>
    <circle cx="1052" cy="640" r="9" fill="#94A3B8"/>
    <rect x="925" y="248" width="145" height="42" rx="9" fill="#2563EB"/>
    <text x="997" y="277" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">LAB · CIENCIAS</text>
  </g>

  <!-- Planta -->
  <g>
    <ellipse cx="152" cy="962" rx="46" ry="26" fill="#22C55E"/>
    <ellipse cx="118" cy="930" rx="34" ry="22" fill="#4ADE80" transform="rotate(-28 118 930)"/>
    <ellipse cx="188" cy="926" rx="36" ry="22" fill="#16A34A" transform="rotate(24 188 926)"/>
    <ellipse cx="152" cy="900" rx="26" ry="30" fill="#4ADE80"/>
    <path d="M112,968 L192,968 L180,1040 L124,1040 Z" fill="#C97B5A"/>
    <rect x="106" y="960" width="92" height="14" rx="7" fill="#B56A49"/>
  </g>

  <!-- Sombra del inspector -->
  <ellipse cx="742" cy="1030" rx="160" ry="18" fill="#0F172A" opacity="0.07"/>

  <!-- Inspector -->
  <g>
    <!-- piernas -->
    <path d="M706,838 L750,838 L754,1006 L716,1006 Z" fill="#1E3A5F"/>
    <path d="M756,838 L794,838 L800,1006 L762,1006 Z" fill="#16304F"/>
    <rect x="688" y="1004" width="72" height="24" rx="10" fill="#0F172A"/>
    <rect x="756" y="1004" width="70" height="24" rx="10" fill="#0F172A"/>
    <!-- torso con chaleco -->
    <path d="M694,652 Q742,632 792,652 L806,850 Q742,868 682,850 Z" fill="#F59E0B"/>
    <path d="M716,646 L720,854 M768,646 L764,854" stroke="#D97706" stroke-width="14" stroke-linecap="round"/>
    <rect x="686" y="758" width="118" height="16" fill="#FDE68A"/>
    <path d="M706,650 Q742,636 780,650 L776,676 Q742,664 710,676 Z" fill="#D97706"/>
    <!-- brazo trasero (apoya) -->
    <path d="M792,668 Q818,720 806,788" fill="none" stroke="#1D4ED8" stroke-width="26" stroke-linecap="round"/>
    <circle cx="806" cy="798" r="15" fill="#ECBC94"/>
    <!-- brazo delantero sosteniendo tablet -->
    <path d="M706,676 Q648,720 592,782" fill="none" stroke="#2458D1" stroke-width="26" stroke-linecap="round"/>
    <circle cx="588" cy="788" r="15" fill="#ECBC94"/>
    <!-- cuello y cabeza -->
    <rect x="722" y="596" width="40" height="34" rx="10" fill="#ECBC94"/>
    <circle cx="742" cy="574" r="46" fill="#F0C29A"/>
    <path d="M700,588 Q688,578 692,566 L706,570 Z" fill="#F0C29A"/>
    <circle cx="716" cy="582" r="4" fill="#1F2937"/>
    <!-- casco -->
    <path d="M694,560 Q696,512 742,510 Q788,512 790,560 Z" fill="#F8FAFC"/>
    <path d="M694,560 L790,560" stroke="#E2E8F0" stroke-width="0"/>
    <rect x="682" y="552" width="120" height="14" rx="7" fill="#E2E8F0"/>
    <line x1="742" y1="512" x2="742" y2="552" stroke="#E2E8F0" stroke-width="6"/>
  </g>

  <!-- Tablet que sostiene -->
  <g transform="rotate(-8 560 830)">
    <rect x="500" y="790" width="130" height="86" rx="10" fill="#0F172A"/>
    <rect x="507" y="797" width="116" height="72" rx="6" fill="#EFF6FF"/>
    <line x1="516" y1="812" x2="600" y2="812" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>
    <line x1="516" y1="830" x2="586" y2="830" stroke="#BFDBFE" stroke-width="6" stroke-linecap="round"/>
    <line x1="516" y1="848" x2="570" y2="848" stroke="#BFDBFE" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Panel UI en primer plano -->
  <g>
    <rect x="430" y="852" width="560" height="300" rx="20" fill="#0F172A" opacity="0.08" transform="translate(0 10)"/>
    <rect x="430" y="852" width="560" height="300" rx="20" fill="#FFFFFF" stroke="#DBE4F0" stroke-width="2"/>
    <text x="466" y="902" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Inspección · Lab. Ciencias</text>
    <rect x="852" y="872" width="108" height="44" rx="22" fill="#FEF2F2" stroke="#FECACA"/>
    <text x="906" y="901" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700" fill="#DC2626">48 pts</text>

    <rect x="466" y="924" width="400" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="466" y="924" width="192" height="10" rx="5" fill="#F59E0B"/>

    <!-- filas de checklist -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">
      <circle cx="480" cy="974" r="12" fill="#DCFCE7"/>
      <path d="M474,974 L479,979 L487,969" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="506" y="982" fill="#334155">Iluminación</text>

      <circle cx="480" cy="1014" r="12" fill="#DCFCE7"/>
      <path d="M474,1014 L479,1019 L487,1009" fill="none" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="506" y="1022" fill="#334155">Mobiliario</text>

      <circle cx="480" cy="1054" r="12" fill="#FEE2E2"/>
      <line x1="480" y1="1048" x2="480" y2="1056" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="480" cy="1061" r="2" fill="#DC2626"/>
      <text x="506" y="1062" fill="#334155">Instalación eléctrica</text>

      <circle cx="480" cy="1094" r="12" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>
      <text x="506" y="1102" fill="#94A3B8">Ventilación</text>
    </g>
  </g>
</svg>
